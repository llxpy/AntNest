name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . mypy
      - name: Run mypy (new enterprise modules)
        run: python -m mypy antnest_errors.py antnest_config_schema.py antnest_log.py antnest_ui_pure.py antnest_inventory.py antnest_permissions.py antnest_registry.py antnest_events.py antnest_plan.py antnest_checkpoint.py ui_render.py --config-file pyproject.toml
