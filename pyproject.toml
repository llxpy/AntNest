[project]
name = "antnest"
version = "1.2.1"
description = "AntNest - an AI coding agent with a queen/worker (ant) architecture and a desktop UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.0",
]

[project.scripts]
antnest = "antnest_launcher:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "prototype_antnest",
  "phtmlwin",
  "antnest_bridge",
  "AntNest",
  "antnest_launcher",
  "code_tools",
  "skills_loader",
  "mcp_client",
  "antnest_clone_worker",
  "antnest_session",
  "ui_render",
  "ui_assets_loader",
  "api_compat",
]
[tool.setuptools.package-data]
"*" = ["ui_assets/*"]
# 把项目内 Page/ 作为数据文件打包，uvx/whl 安装后仍在 site-packages/Page
[tool.setuptools.data-files]
Page = ["Page/*"]
