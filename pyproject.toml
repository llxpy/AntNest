[project]
name = "antnest"
version = "1.4.0"
description = "AntNest - an AI coding agent with a queen/worker (ant) architecture and a desktop UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.0",
]

[project.scripts]
antnest = "antnest_launcher:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "antnest_errors",
  "antnest_config_schema",
  "antnest_log",
  "antnest_ui_pure",
  "antnest_inventory",
  "antnest_permissions",
  "antnest_registry",
  "antnest_events",
  "antnest_plan",
  "antnest_checkpoint",
  "ui_render",
]
disallow_untyped_defs = true
disallow_any_generics = false

[tool.setuptools]
py-modules = [
  "prototype_antnest",
  "phtmlwin",
  "antnest_bridge",
  "AntNest",
  "antnest_launcher",
  "code_tools",
  "skills_loader",
  "mcp_client",
  "memory_retrieval",
  "antnest_runtime_state",
  "memory_tree",
  "antnest_clone_worker",
  "antnest_session",
  "ui_render",
  "ui_assets_loader",
  "api_compat",
  "admin_utils",
  "task_manager",
  "antnest_config",
  "antnest_schemas",
  "antnest_queen",
  "antnest_memory",
  "antnest_llm",
  "antnest_loop",
  "antnest_toolforge",
  "model_capabilities",
  "antnest_log",
  "antnest_errors",
  "antnest_config_schema",
  "antnest_ui_pure",
  "antnest_inventory",
  "antnest_permissions",
  "antnest_registry",
  "antnest_events",
  "antnest_plan",
  "antnest_checkpoint",
]
[tool.setuptools.package-data]
"*" = ["ui_assets/*", "prompts/*"]
# 把项目内 assets/donate/ 作为数据文件打包，uvx/whl 安装后仍在 site-packages/assets/donate
[tool.setuptools.data-files]
"assets/donate" = ["assets/donate/*"]
